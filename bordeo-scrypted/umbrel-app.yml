torOnly: false
releaseNotes: >-
  Initial Bordeo packaging of Scrypted v0.147.0 (koush/scrypted
  v0.147.0-noble-full). Host networking for HomeKit/mDNS, Ciao advertiser
  (no host avahi changes), volume layout compatible with denny-scrypted
  migration, and Umbrel-managed updates (no Watchtower / Docker socket).
